[project]
name = "modul1"
version = "0.1.0"
description = "Modul 1 tahap 1.1–1.3: crawling, preprocessing, deduplikasi tweet bencana"
requires-python = ">=3.11"
dependencies = [
    "datasketch==2.0.0",
    "ftfy==6.3.1",
    "numpy==2.4.6",
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
    "pyyaml==6.0.3",
    "rapidfuzz==3.14.6",
    "truststore==0.10.4",
    "twscrape==0.20.1",
    "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
