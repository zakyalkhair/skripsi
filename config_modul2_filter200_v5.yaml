# Modul 2 — prompt v5 (27 Okt 2026; v4 + 4 contoh berita pendek + pemetaan objek): tanpa atribut faktualitas (keputusan 25 Okt). Data PENGEMBANGAN 2025 saja.
# Masukan = hasil filter 1.4 (prompt keempat, 200 tweet sampel anotasi) yang informatif, TANPA laporan otomatis BMKG.
# Jalankan dari folder skripsi:  python -m modul2 ekstrak --config config_modul2_filter200_v5.yaml
prompt_versi: v5
seed: 42
acak: false
limit: null

paths:
  input: dev_2025/data/processed/input_modul2_filter200.parquet
  raw: dev_2025/data/interim/extraction_raw_filter200_v5.jsonl
  valid: dev_2025/data/processed/extraction_valid_filter200_v5.jsonl
  validation_log: dev_2025/reports/validation_log_filter200_v5.csv
  logs_dir: dev_2025/logs

llm:
  api: ollama
  base_url: http://localhost:11434
  model: qwen2.5-cpu
  api_key_env: null
  num_ctx: 16384                     # v5: prompt ±10,7 ribu token (system + 19 contoh) + jawaban hingga 4.096
  max_tokens_tingkat: [1024, 4096]
  timeout_s: 1800
