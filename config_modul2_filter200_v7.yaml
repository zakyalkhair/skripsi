# Modul 2 — prompt v7 (8 Nov 2026; v6 + 13 bentuk penulisan lokasi mengikuti kategori Hu dkk. 2023, dan singkatan kota tambahan). Data PENGEMBANGAN 2025 saja. BELUM dijalankan.
# Masukan = hasil filter 1.4 (prompt keempat, 200 tweet sampel anotasi) yang informatif, TANPA laporan otomatis BMKG.
# Jalankan dari folder skripsi:  python -m modul2 ekstrak --config config_modul2_filter200_v7.yaml
prompt_versi: v7
seed: 42
acak: false
limit: null

paths:
  input: dev_2025/data/processed/input_modul2_filter200.parquet
  raw: dev_2025/data/interim/extraction_raw_filter200_v7.jsonl
  valid: dev_2025/data/processed/extraction_valid_filter200_v7.jsonl
  validation_log: dev_2025/reports/validation_log_filter200_v7.csv
  logs_dir: dev_2025/logs

llm:
  api: ollama
  base_url: http://localhost:11434
  model: qwen2.5-cpu
  api_key_env: null
  num_ctx: 16384                     # v5: prompt ±10,7 ribu token (system + 16 contoh) + jawaban hingga 4.096
  max_tokens_tingkat: [1024, 4096]
  timeout_s: 1800

resolusi:  # 2.3 tahap administratif (28 Okt 2026)
  gazetir_sql: data/gazetir/wilayah.sql
  resolved: dev_2025/data/processed/extraction_resolved_filter200_v7.jsonl
  resolution_log: dev_2025/reports/resolution_log_filter200_v7.csv
