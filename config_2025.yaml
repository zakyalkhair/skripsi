# Konfigurasi DATA PENGEMBANGAN 2025 (keputusan 7 Okt 2026): minggu pertama (tgl 1–7) tiap bulan Jul–Des 2025, 300 tweet/kueri.
# Jalankan SELALU dengan: python -m modul1 --config config_2025.yaml --workdir dev_2025 <perintah>
# --workdir memisahkan data/, logs/, reports/ dari korpus utama 2026.
# Konfigurasi Modul 1 tahap 1.1–1.3.
# Semua path relatif: `kejadian` dan `prompt_informatif` relatif terhadap folder file ini,
# sisanya relatif terhadap --workdir (default: folder file ini).

seed: 42 # seed tunggal untuk semua proses acak (MinHash, sampling)

paths:
  kejadian: config/kejadian_2025.csv # data pengembangan: 1–7 tiap bulan Jul–Des 2025 (6 periode × 9 jenis) # B62: 9 baris nasional per jenis (kueri crawl)
  raw_jsonl: data/raw/raw.jsonl
  crawl_log: data/raw/crawl_log.csv
  crawl_progress: data/raw/crawl_progress.json
  twscrape_db: data/raw/twscrape_accounts.db
  crawled: data/interim/crawled.parquet
  preprocessed: data/interim/preprocessed.parquet
  dedup: data/interim/dedup.parquet
  final: data/processed/modul1_until_1_3.parquet
  input_1_4: data/processed/input_1_4.parquet
  logs_dir: logs
  alur_data: reports/alur_data.csv
  sampel_kueri: reports/sampel_cek_kueri.csv
  dedup_ringkasan: reports/dedup_ringkasan.json
  kalibrasi: reports/kalibrasi_dedup.csv
  kalibrasi_laporan: reports/kalibrasi_laporan.csv
  # 1.4 filter informatif
  prompt_informatif: config/prompt_informatif.md
  llm_labels: data/interim/llm_labels_1_4.jsonl
  hasil_1_4: data/processed/hasil_1_4.parquet
  informatif: data/processed/informatif.parquet
  bandingkan_laporan: reports/bandingkan_1_4.json # filter-bandingkan: persen setuju, kappa, matriks
  bandingkan_beda: data/interim/beda_1_4.jsonl # tweet yang labelnya berbeda (untuk adjudikasi manual)

crawl:
  max_tweets_per_query: 300 # data pengembangan 2025
  # Perpanjangan jendela waktu kueri di luar tanggal_mulai/tanggal_selesai di kejadian.csv
  # (kejadian.csv tetap mencatat tanggal kejadian apa adanya). 0 = tanpa perpanjangan.
  padding_hari_sebelum: 0
  padding_hari_sesudah: 0
  # true = pakai sertifikat bawaan sistem operasi (truststore). Perlu di jaringan kantor/kampus
  # yang memeriksa HTTPS (error "CERTIFICATE_VERIFY_FAILED: unable to get local issuer certificate").
  use_system_certs: true
  sleep_between_queries_s: 5 # jeda antar kueri (batas laju tambahan di luar twscrape)
  max_query_chars: 500 # kueri lebih panjang dipecah menjadi beberapa kueri (alias dibagi)
  # Kosong: operator lang:id merusak hasil pencarian lewat twscrape (uji scripts/cek_twscrape.py,
  # 28-09-2026: dengan lang:id hasil 0 / tweet 2014; tanpa lang:id normal). Bahasa disaring
  # sesudah crawl di saring dasar (lang == "in", selain itu drop_reason=bukan_id).
  lang_operator: ""
  # 7 Okt 2026: kata "tsunami" dipakai global -> kueri tanpa filter bahasa diisi tweet asing (2026: 2,2%
  # bahasa Indonesia, 38/40 kueri mentok). Uji scripts/cek_lang_in.py: `lang:in` = 97% Indonesia (119 tweet),
  # `lang:id` = 0 tweet (kode X untuk Indonesia adalah "in", bukan "id"). Saring bahasa sesudah crawl tetap
  # lang == "in", jadi lang:in hanya membuang tweet yang memang akan dibuang.
  lang_operator_kata_kunci: {tsunami: "lang:in"}
  retweet_operator: "-filter:retweets"
  # B63: from:infoBMKG = bot laporan otomatis gempa BMKG dikecualikan sejak crawl (99% templat "Gempa Mag:")
  negative_keywords: [kecelakaan, "from:infoBMKG"]
  # B62: crawl nasional 1 Jan 2026 - hari ini -> jendela dipecah per 7 hari agar batas 2.000/kueri tidak memotong.
  # Kueri yang n_hasil-nya menyentuh batas di crawl_log -> perkecil (mis. 1) dan crawl ulang kueri itu.
  pecah_jendela_hari: 7
  summary_sample_n: 5 # contoh tweet yang dicetak setelah satu kejadian selesai
  sample_per_query: 50 # sampel cek manual per kueri -> reports/sampel_cek_kueri.csv
  # Kunci = jenis BNPB (B53): gempabumi, tanah_longsor, gelombang_pasang_abrasi, ... (sama dengan kejadian.csv)
  keywords:
    karhutla: [karhutla, kebakaran hutan, kebakaran lahan, kabut asap, titik api]
    gempabumi: [gempa, gempa bumi, gempa susulan, pengungsi]
    banjir: [banjir, banjir bandang, terendam, pengungsi]
    tanah_longsor: [longsor, tanah longsor, tertimbun]
    erupsi: [erupsi, letusan, awan panas, abu vulkanik, mengungsi]
    # cuaca ekstrem: semua subtipe DIBI digabung jadi satu daftar
    cuaca_ekstrem: [cuaca ekstrem, puting beliung, angin kencang, angin topan, hujan es, siklon tropis, suhu ekstrem]
    kekeringan: [kekeringan, krisis air bersih, kemarau panjang, kesulitan air bersih, droping air bersih, gagal panen]
    gelombang_pasang_abrasi: [gelombang pasang, gelombang tinggi, banjir rob, abrasi, abrasi pantai, air laut naik]
    tsunami: [tsunami]

saring_dasar:
  lang: "in" # kode bahasa Indonesia di X

preprocess:
  url_token: "<URL>"
  user_token: "<USER>"
  min_words: 3 # < min_words kata (tanpa placeholder) -> too_short
  # Hanya untuk text_clean (dedup); text_raw tidak berubah.
  hapus_mention: true # true = @x dihapus seluruhnya; false = diganti <USER>
  hapus_hashtag: true # true = #Kata dihapus seluruhnya; false = hanya tanda # dibuang

dedup:
  shingle_size: 5 # shingle karakter
  num_perm: 128
  lsh_threshold: 0.7
  fuzz_threshold: 85 # rapidfuzz.fuzz.ratio

calibration:
  bin_start: 70
  bin_end: 100
  bin_width: 5
  per_bin: 20
  target_precision: 0.95

filter_llm: # tahap 1.4 — klasifikasi biner informatif/noninformatif (API OpenAI-compatible)
  # Jalur utama (keputusan 6 Okt 2026): Qwen lokal lewat Ollama, full CPU. Groq dihapus 7 Okt 2026
  # (tidak dipakai: tweet tidak dikirim ke pihak ketiga). Buat model dulu (folder Skripsi):
  #   ollama create qwen2.5-cpu -f ..\Modelfile.optimized
  base_url: http://localhost:11434/v1
  model: qwen2.5-cpu
  api_key_env: null # lokal, tanpa kunci
  extra_body: # parameter tambahan khusus penyedia (ikut prompt_hash)
    response_format: {type: json_object}
  tweet_per_permintaan: 5
  max_tokens: 2048 # 5 label pendek ±300 token; Qwen tanpa reasoning
  temperature: 0 # deterministik semampunya
  timeout_s: 900 # CPU: ±1–2 menit/permintaan
  max_retry: 3 # untuk galat sementara (5xx, timeout)
  jeda_antar_permintaan_s: 0
  tunggu_429_maks_s: 120
  # Tweet yang tidak cocok aturan mana pun dikirim ke LLM. false = tanpa LLM (regex saja):
  # tweet yang tidak cocok diberi label_default.
  pakai_llm: true
  label_default: null # dipakai hanya bila pakai_llm: false (mis. noninformatif)

  # Aturan regex (case-insensitive), dievaluasi berurutan; aturan pertama yang cocok menentukan
  # label (label_sumber = "aturan:<nama>"). Setiap aturan:
  #   semua: semua pola harus cocok | salah_satu: minimal satu pola cocok
  #   kecuali: tidak boleh ada yang cocok | wilayah_kejadian: harus menyebut alias_wilayah kejadian
  # Prinsip: hanya aturan POSITIF berbasis format baku (tanpa menilai makna); selebihnya ke LLM.
  aturan:
    # (17 Okt 2026) Templat BMKG berkekuatan <= M4,0 -> TIDAK informatif (keputusan user: "jika prediksi atau berkekuatan
    # di bawah M4 maka tidak informatif"; M4,0 ikut gugur, hanya M >= 4,1 yang lolos; kata "Dirasakan" bukan pengecualian).
    # Tweet tidak dihapus: tetap ada di hasil_1_4 dengan label_sumber = aturan:bmkg_kecil. Aturan ini berbasis ANGKA pada
    # format baku, bukan penilaian makna. Bagian "prediksi" dari keputusan itu tidak berlaku pada templat (templat selalu
    # laporan gempa yang sudah terjadi); tweet prakiraan/peringatan dini lain ditangani pedoman LLM dan keputusan
    # peringatan dini BMKG yang masih terbuka.
    - nama: bmkg_kecil
      label: noninformatif
      semua: ['gempa\s+mag\s*:\s*(?:[0-3](?:[.,]\d+)?|4(?:[.,]0+)?)(?![.,]?\d)', '\blok\s*:']
    - nama: bmkg # laporan gempa berformat baku BMKG (I6): salinan media DAN akun BMKG daerah -> informatif.
      # 7 Okt 2026: akun BMKG daerah diperlakukan sama di 1.4 (dilabel oleh aturan ini), tidak dikecualikan di crawl.
      label: informatif
      semua: ['gempa\s+mag\s*:\s*\d', '\blok\s*:']
      # syarat wilayah_kejadian dihapus 6 Okt 2026: crawl nasional tanpa daerah acuan
    # (7 Okt 2026) Aturan "tidak informatif" (topik_lain, doa_tanpa_fakta) DIHAPUS — keputusan: aturan positif
    # saja. Alasan: regex tidak memahami makna/sarkasme, salah buang = tweet hilang permanen, dan pada data
    # pengembangan 2025 keduanya hanya menangkap ±1,3% wakil (penghematan waktu LLM tidak berarti).

# Profil penyedia LLM alternatif untuk tahap 1.4: python -m modul1 filter --profil <nama>
# Isinya menimpa kolom filter_llm di atas (aturan regex tetap sama). Keluaran ditulis ke
# hasil_1_4_<nama>.parquet, informatif_<nama>.parquet, alur_data_<nama>.csv sehingga hasil utama
# tidak tertimpa. Label semua model disimpan bersama di llm_labels_1_4.jsonl (dibedakan prompt_hash
# dan kolom model) -> bandingkan dengan: python -m modul1 filter-bandingkan --a <model> --b <model>
profil_llm:
  # Uji jumlah tweet per permintaan pada data pengembangan 2025 (Cheng dkk. 2023): 1 vs 3 vs 5.
  # 5 = filter_llm utama. Jalankan: python -m modul1 --config config_2025.yaml --workdir dev_2025 filter --profil qwen_b1
  qwen_b1:
    tweet_per_permintaan: 1
  qwen_b3:
    tweet_per_permintaan: 3
  ollama: # lokal, tanpa kuota & tanpa kunci. `ollama pull gpt-oss:20b` (butuh RAM/VRAM ±16 GB)
    base_url: http://localhost:11434/v1
    model: gpt-oss:20b
    api_key_env: null
    tweet_per_permintaan: 10 # konteks bawaan Ollama kecil; lihat OLLAMA_CONTEXT_LENGTH di README
    max_tokens: 4096
    timeout_s: 600 # CPU/GPU lokal bisa lambat
    jeda_antar_permintaan_s: 0
  ollama_cloud: # model besar di cloud Ollama lewat server lokal; perlu `ollama signin` (kuota gratis terbatas)
    base_url: http://localhost:11434/v1
    model: gpt-oss:120b-cloud
    api_key_env: null
    jeda_antar_permintaan_s: 2
  ollama_qwen: # model non-gpt-oss: tanpa reasoning_effort. `ollama pull qwen2.5:7b`
    base_url: http://localhost:11434/v1
    model: qwen2.5:7b
    api_key_env: null
    extra_body: {response_format: {type: json_object}}
    tweet_per_permintaan: 10
    max_tokens: 2048
    timeout_s: 600
    jeda_antar_permintaan_s: 0
  ollama_qwen_cpu: # B60/K2: full CPU, konteks 8192, suhu 0. Buat dulu modelnya (folder Skripsi):
    #   ollama create qwen2.5-cpu -f ..\Modelfile.optimized
    # Dipakai untuk ulang 1.4 (K-1.4a): batch lebih kecil agar tweet panjang tidak gagal.
    base_url: http://localhost:11434/v1
    model: qwen2.5-cpu
    api_key_env: null
    extra_body: {response_format: {type: json_object}}
    tweet_per_permintaan: 5
    max_tokens: 2048 # 5 label pendek ±300 token; Qwen tanpa reasoning
    temperature: 0
    timeout_s: 900 # CPU: ±1–2 menit/permintaan, beri ruang
    jeda_antar_permintaan_s: 0
