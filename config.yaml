# Konfigurasi Modul 1 tahap 1.1–1.3.
# Semua path relatif: `kejadian` dan `prompt_informatif` relatif terhadap folder file ini,
# sisanya relatif terhadap --workdir (default: folder file ini).

seed: 42 # seed tunggal untuk semua proses acak (MinHash, sampling)

paths:
  kejadian: config/kejadian.csv
  raw_jsonl: data/raw/raw.jsonl
  crawl_log: data/raw/crawl_log.csv
  crawl_progress: data/raw/crawl_progress.json
  twscrape_db: data/raw/twscrape_accounts.db
  crawled: data/interim/crawled.parquet
  preprocessed: data/interim/preprocessed.parquet
  dedup: data/interim/dedup.parquet
  final: data/processed/modul1_until_1_3.parquet
  input_1_4: data/processed/input_1_4.parquet
  logs_dir: logs
  alur_data: reports/alur_data.csv
  sampel_kueri: reports/sampel_cek_kueri.csv
  dedup_ringkasan: reports/dedup_ringkasan.json
  kalibrasi: reports/kalibrasi_dedup.csv
  kalibrasi_laporan: reports/kalibrasi_laporan.csv
  # 1.4 filter informatif
  prompt_informatif: config/prompt_informatif.md
  llm_labels: data/interim/llm_labels_1_4.jsonl
  hasil_1_4: data/processed/hasil_1_4.parquet
  informatif: data/processed/informatif.parquet
  bandingkan_laporan: reports/bandingkan_1_4.json # filter-bandingkan: persen setuju, kappa, matriks
  bandingkan_beda: data/interim/beda_1_4.jsonl # tweet yang labelnya berbeda (untuk adjudikasi manual)

crawl:
  only_pilot: true # false = semua 29 kejadian
  max_tweets_per_query: 2000
  # Perpanjangan jendela waktu kueri di luar tanggal_mulai/tanggal_selesai di kejadian.csv
  # (kejadian.csv tetap mencatat tanggal kejadian apa adanya). 0 = tanpa perpanjangan.
  padding_hari_sebelum: 0
  padding_hari_sesudah: 0
  # true = pakai sertifikat bawaan sistem operasi (truststore). Perlu di jaringan kantor/kampus
  # yang memeriksa HTTPS (error "CERTIFICATE_VERIFY_FAILED: unable to get local issuer certificate").
  use_system_certs: true
  sleep_between_queries_s: 5 # jeda antar kueri (batas laju tambahan di luar twscrape)
  max_query_chars: 500 # kueri lebih panjang dipecah menjadi beberapa kueri (alias dibagi)
  # Kosong: operator lang:id merusak hasil pencarian lewat twscrape (uji scripts/cek_twscrape.py,
  # 28-09-2026: dengan lang:id hasil 0 / tweet 2014; tanpa lang:id normal). Bahasa disaring
  # sesudah crawl di saring dasar (lang == "in", selain itu drop_reason=bukan_id).
  lang_operator: ""
  retweet_operator: "-filter:retweets"
  negative_keywords: [kecelakaan]
  summary_sample_n: 5 # contoh tweet yang dicetak setelah satu kejadian selesai
  sample_per_query: 50 # sampel cek manual per kueri -> reports/sampel_cek_kueri.csv
  keywords:
    karhutla: [karhutla, kebakaran hutan, kebakaran lahan, kabut asap, titik api]
    gempa: [gempa, gempa bumi, gempa susulan, pengungsi]
    banjir: [banjir, banjir bandang, terendam, pengungsi]
    longsor: [longsor, tanah longsor, tertimbun]
    erupsi: [erupsi, letusan, awan panas, abu vulkanik, mengungsi]

saring_dasar:
  lang: "in" # kode bahasa Indonesia di X

preprocess:
  url_token: "<URL>"
  user_token: "<USER>"
  min_words: 3 # < min_words kata (tanpa placeholder) -> too_short
  # Hanya untuk text_clean (dedup); text_raw tidak berubah.
  hapus_mention: true # true = @x dihapus seluruhnya; false = diganti <USER>
  hapus_hashtag: true # true = #Kata dihapus seluruhnya; false = hanya tanda # dibuang

dedup:
  shingle_size: 5 # shingle karakter
  num_perm: 128
  lsh_threshold: 0.7
  fuzz_threshold: 85 # rapidfuzz.fuzz.ratio

calibration:
  bin_start: 70
  bin_end: 100
  bin_width: 5
  per_bin: 20
  target_precision: 0.95

filter_llm: # tahap 1.4 — klasifikasi biner informatif/noninformatif (API OpenAI-compatible)
  # Groq (gratis, model open-weight gpt-oss). Kunci di .env: GROQ_API_KEY
  base_url: https://api.groq.com/openai/v1
  model: openai/gpt-oss-120b
  api_key_env: GROQ_API_KEY
  # Penyedia lain (mis. Ollama) -> lihat profil_llm di bawah; jalankan dengan --profil.
  extra_body: # parameter tambahan khusus penyedia (ikut prompt_hash)
    response_format: {type: json_object}
    reasoning_effort: low # gpt-oss: hemat token; hapus untuk model lain (mis. Ollama/Qwen)
  tweet_per_permintaan: 20
  max_tokens: 2048 # cukup untuk reasoning + JSON 20 label
  temperature: 0 # deterministik semampunya
  timeout_s: 120
  max_retry: 3 # untuk galat sementara (5xx, timeout, 429 singkat)
  jeda_antar_permintaan_s: 8 # menjaga batas token per menit (Groq gratis: 8K TPM)
  tunggu_429_maks_s: 120 # 429 dengan jeda lebih lama (kuota harian) -> berhenti rapi
  # Tweet yang tidak cocok aturan mana pun dikirim ke LLM. false = tanpa LLM (regex saja):
  # tweet yang tidak cocok diberi label_default.
  pakai_llm: true
  label_default: null # dipakai hanya bila pakai_llm: false (mis. noninformatif)

  # Aturan regex (case-insensitive), dievaluasi berurutan; aturan pertama yang cocok menentukan
  # label (label_sumber = "aturan:<nama>"). Setiap aturan:
  #   semua: semua pola harus cocok | salah_satu: minimal satu pola cocok
  #   kecuali: tidak boleh ada yang cocok | wilayah_kejadian: harus menyebut alias_wilayah kejadian
  # Prinsip: presisi tinggi. Aturan noninformatif batal bila ada petunjuk fakta (angka, korban,
  # kerusakan, kebutuhan, pengungsian, bahaya) -> diserahkan ke LLM.
  aturan:
    - nama: bmkg # laporan otomatis BMKG untuk wilayah kejadian (I6)
      label: informatif
      semua: ['gempa\s+mag\s*:\s*\d', '\blok\s*:']
      wilayah_kejadian: true
    - nama: topik_lain # MBG, perayaan/karnaval tanpa fakta bencana (N3)
      label: noninformatif
      salah_satu: ['\bmbg\b', 'makan\s+bergizi', '\bkarnaval\b', '\b17\s+agustus(an)?\b', '\bhut\s+(ri|ke)',
                   '\bkemerdekaan\b', '\bpesta\b', '\bkonser\b']
      kecuali: &fakta
        - '\d'
        - '\b(meninggal|tewas|wafat|korban\s+jiwa|luka|hilang|tertimbun)'
        - '\b(mengungsi|pengungsi|pengungsian|posko|tenda)'
        - '\b(rusak|roboh|ambruk|runtuh|retak|hancur|putus)'
        - '\b(butuh|kebutuhan|kekurangan|minim|logistik|air\s+bersih|selimut|obat|sembako)'
        - '\b(susulan|tsunami|evakuasi|dievakuasi|sar\b|basarnas|bnpb|bpbd|bmkg)'
    - nama: doa_tanpa_fakta # hanya doa/empati (N1)
      label: noninformatif
      salah_satu: ['\bsemoga\b', '\bdoa\b', '\bmendoakan\b', '\bpray', 'turut\s+berduka', '\bberduka\b',
                   'ya\s*allah', 'innalillahi', '\baa?mii?n\b', '\btuhan\b', '\bstay\s+safe\b', '\bget\s+well\b']
      kecuali: *fakta

# Profil penyedia LLM alternatif untuk tahap 1.4: python -m modul1 filter --profil <nama>
# Isinya menimpa kolom filter_llm di atas (aturan regex tetap sama). Keluaran ditulis ke
# hasil_1_4_<nama>.parquet, informatif_<nama>.parquet, alur_data_<nama>.csv sehingga hasil utama
# tidak tertimpa. Label semua model disimpan bersama di llm_labels_1_4.jsonl (dibedakan prompt_hash
# dan kolom model) -> bandingkan dengan: python -m modul1 filter-bandingkan --a <model> --b <model>
profil_llm:
  ollama: # lokal, tanpa kuota & tanpa kunci. `ollama pull gpt-oss:20b` (butuh RAM/VRAM ±16 GB)
    base_url: http://localhost:11434/v1
    model: gpt-oss:20b
    api_key_env: null
    tweet_per_permintaan: 10 # konteks bawaan Ollama kecil; lihat OLLAMA_CONTEXT_LENGTH di README
    max_tokens: 4096
    timeout_s: 600 # CPU/GPU lokal bisa lambat
    jeda_antar_permintaan_s: 0
  ollama_cloud: # model besar di cloud Ollama lewat server lokal; perlu `ollama signin` (kuota gratis terbatas)
    base_url: http://localhost:11434/v1
    model: gpt-oss:120b-cloud
    api_key_env: null
    jeda_antar_permintaan_s: 2
  ollama_qwen: # model non-gpt-oss: tanpa reasoning_effort. `ollama pull qwen2.5:7b`
    base_url: http://localhost:11434/v1
    model: qwen2.5:7b
    api_key_env: null
    extra_body: {response_format: {type: json_object}}
    tweet_per_permintaan: 10
    max_tokens: 2048
    timeout_s: 600
    jeda_antar_permintaan_s: 0
